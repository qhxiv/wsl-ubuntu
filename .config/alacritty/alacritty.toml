[window]
padding = { x = 4, y = 4 }
startup_mode = "Maximized"

[font]
normal = { family = "AdwaitaMono Nerd Font" }
size = 12

[cursor]
thickness = 0.2

[terminal]
shell = { program = "wsl", args = ["-d", "ubuntu", "--cd", "~"] }

# [colors.normal]
